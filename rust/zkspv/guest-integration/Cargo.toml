[package]
name = "satoshifi-mainnet-guest-kernel"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
satoshifi-resume-transition = { path = "../resume-transition" }
bitcoin-da = { path = "../vendor-native/crates/bitcoin-da", default-features = false }
sov-rollup-interface = { path = "../vendor-native/crates/sovereign-sdk/rollup-interface", default-features = false }
bitcoin = { version = "=0.32.5", default-features = false, features = ["std"] }

[profile.dev]
debug = 0
incremental = false
[profile.release]
debug = 0
incremental = false
lto = true
codegen-units = 1

