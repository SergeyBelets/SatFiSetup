publish = false
license = "MIT"
[workspace]
[dependencies]
satoshifi-mainnet-guest-kernel = { path = "../../guest-integration" }
bitcoin-da = { path = "../../vendor-native/crates/bitcoin-da", default-features = false }
sov-rollup-interface = { path = "../../vendor-native/crates/sovereign-sdk/rollup-interface", default-features = false }
