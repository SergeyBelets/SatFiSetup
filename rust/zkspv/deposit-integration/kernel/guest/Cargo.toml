[package]
name = "satoshifi-regtest-deposit-guest"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
[workspace]
[dependencies]
satoshifi-regtest-deposit-kernel = { path = ".." }
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["unstable", "std"] }
risc0-bigint2 = "=1.4.10"

# Exactly the upstream guest's patches; Cargo.lock fixes the resolved commits.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
secp256k1 = { git = "https://github.com/Sovereign-Labs/rust-secp256k1.git", branch = "risc0-compatible-0-29-0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }

[profile.release]
debug = 0
lto = true
opt-level = 3
codegen-units = 1

