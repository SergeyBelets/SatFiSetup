[package]
name = "satoshifi-receipt-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
[workspace]
[dependencies]
risc0-binfmt = { version = "=3.0.2", default-features = false, features = ["std"] }
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["client", "std", "disable-dev-mode"] }
bincode = "=1.3.3"
serde_json = "=1.0.139"
hex = "=0.4.3"

[profile.dev]
debug = 0
incremental = false

