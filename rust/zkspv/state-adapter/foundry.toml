[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["../../../web3/lib"]
allow_paths = ["../../.."]
auto_detect_remappings = false
optimizer = true
optimizer_runs = 1
via_ir = true
solc_version = "0.8.39"
evm_version = "osaka"
fs_permissions = [{access="read",path="./fixtures"}]
remappings = [
  "satoshifi-core/=../../../web3/contracts/src/core/",
  "risc0-verifier/=../vendor/risc0-ethereum-3.1.0/contracts/src/",
  "forge-std/=../../../web3/lib/openzeppelin-contracts/lib/forge-std/src/",
  "openzeppelin/=../../../web3/lib/openzeppelin-contracts/",
]

# Cross-project test remappings change Solidity metadata. Keep this profile's
# generated artifacts separate from the deployment artifacts in out/.
[profile.recovery]
test = "recovery-test"
out = "cache/recovery-test/out"
cache_path = "cache/recovery-test/compile"
remappings = [
  "satoshifi-core/=../../../web3/contracts/src/core/",
  "satoshifi-project/=../../../web3/",
  "risc0-verifier/=../vendor/risc0-ethereum-3.1.0/contracts/src/",
  "forge-std/=../../../web3/lib/openzeppelin-contracts/lib/forge-std/src/",
  "openzeppelin/=../../../web3/lib/openzeppelin-contracts/",
  "@openzeppelin/contracts=../../../web3/lib/openzeppelin-contracts/contracts",
  "@openzeppelin/contracts-upgradeable=../../../web3/lib/openzeppelin-contracts-upgradeable/contracts",
]
