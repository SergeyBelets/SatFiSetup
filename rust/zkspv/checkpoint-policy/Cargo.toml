[package]
name = "satoshifi-checkpoint-policy"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Mainnet checkpoint validation and initial verifier context"

[workspace]

[dependencies]
bitcoin = { version = "=0.32.5", default-features = false, features = ["std"] }
crypto-bigint = { version = "=0.5.5", default-features = false }
satoshifi-fork-policy = { path = "../fork-policy" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
